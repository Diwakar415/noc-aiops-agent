version: '3.8'

services:
  noc-aiops-agent:
    build: .
    container_name: noc_aiops_agent
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "1162:1162/udp"
    environment:
      - PORT=8080
      - REMEDY_BASE_URL=https://remedy.telecom.local
      - MOCK_REMEDY=True
      - MOCK_LLM=True

  prometheus:
    image: prom/prometheus:latest
    container_name: noc_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: noc_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
